<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#160d26"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Воительницы"><meta name="description" content="Офлайн-стратегия о королевах семи эпох"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="app.css"><title>Империя воительниц — глянцевые хроники</title></head><body>
<div id="app">
<header><div><div class="eyebrow">GLOSS CHRONICLES · OFFLINE</div><h1>ИМПЕРИЯ <span>ВОИТЕЛЬНИЦ</span></h1></div><div class="wallet"><div>🪙 <b id="gold">180</b></div><div>💎 <b id="gems">85</b></div></div></header>
<div class="champ" id="champ"></div>
<main id="battlePage"><div class="battleframe"><canvas id="canvas" width="390" height="300" aria-label="Поле боя, слева — ваша база, справа — вражеская"></canvas><div class="topchip" id="topchip"></div><div class="hpbar" id="hpbar"></div></div>
<div class="sectionname"><div><small id="eraText"></small><h2 id="eraName"></h2></div><button class="mode" data-a="mode" id="modeBtn">Поход ⟳</button></div>
<div class="foodbar"><span>🍎 <b id="foodValue">12</b></span><div class="bar"><i id="foodFill"></i></div><span id="foodRate">+2.1/с</span></div>
<div class="sectionname"><b>ВОИТЕЛЬНИЦЫ</b><small>Нажимай, чтобы призвать</small></div><div id="units" class="unitgrid"></div>
<div class="sectionname"><b>МАГИЯ И КОМАНДИРША</b><small>Каждое умение 1 раз за бой</small></div><div class="spells" id="spells"></div>
<div id="fightaction"></div><p class="hint" id="hint"></p></main>
<main id="otherPage" hidden></main>
<nav id="nav"></nav>
</div><div id="modal" hidden></div><div id="toast"></div><input id="savefile" type="file" accept=".json,application/json" hidden><script src="app.js" defer></script></body></html>
