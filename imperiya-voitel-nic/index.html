<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>
(function(){
  var path=location.pathname,dir,seg;
  if(path.endsWith("/"))dir=path;
  else{
    seg=path.split("/").pop()||"";
    dir=seg.indexOf(".")>=0?path.replace(/[^/]*$/,""):path+"/";
  }
  if(!dir.endsWith("/"))dir+="/";
  var base=document.createElement("base");
  base.href=dir;
  document.head.appendChild(base);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
(function(){
  function lockWidth(){
    var vv=window.visualViewport, list=[window.innerWidth, document.documentElement.clientWidth, vv&&vv.width], nums=[], i, n, w;
    for(i=0;i<list.length;i++){ n=Number(list[i]); if(n>0) nums.push(n); }
    w=nums.length?Math.min.apply(null, nums):390;
    document.documentElement.style.setProperty("--vvw", Math.round(w)+"px");
  }
  lockWidth();
  window.addEventListener("resize", lockWidth);
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", lockWidth);
    window.visualViewport.addEventListener("scroll", lockWidth);
  }
})();
</script>
<meta name="theme-color" content="#7EC8F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Воительницы">
<meta name="description" content="Офлайн-стратегия для iPhone: 18 мультяшных героинь, бесплатный магазин и бой на одном экране">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="rock-v17.css?v=19">
<link rel="stylesheet" href="cartoon-v18.css?v=19">
<title>Империя воительниц</title>
</head>
<body>
<div id="app">
<header id="gameHeader">
  <img class="brand-logo" src="art18/ui/webp/logo.webp" alt="Империя воительниц">
  <div class="wallet">
    <div class="pill"><img src="art18/ui/webp/coin.webp" alt=""> <b id="gold">180</b></div>
    <div class="pill"><img src="art18/ui/webp/gem.webp" alt=""> <b id="gems">85</b></div>
  </div>
</header>
<div class="champ" id="champ"></div>
<div id="audioDock" class="audio-dock" aria-label="Звуковая панель"></div>
<aside id="mentor" class="mentor" aria-label="Советы Ирис"></aside>
<main id="battlePage">
  <div class="battleframe">
    <canvas id="canvas" width="390" height="300" aria-label="Поле боя, слева — ваша база, справа — вражеская"></canvas>
    <div class="topchip" id="topchip"></div>
    <div class="bossbar" id="bossbar" hidden></div>
    <div class="battle-alert" id="battleAlert" hidden></div>
    <div class="hpbar" id="hpbar"></div>
  </div>
  <div id="fightaction"></div>
  <div class="sectionname" id="worldHeading"><div><small id="eraText"></small><h2 id="eraName"></h2></div><button class="mode" data-a="mode" id="modeBtn">Поход</button></div>
  <div class="foodbar"><span>🍎 <b id="foodValue">12</b></span><div class="bar"><i id="foodFill"></i></div><span id="foodRate">+2.1/с</span></div>
  <div id="heroStatus" class="hero-status" aria-label="Особый приём героини" hidden></div>
  <div class="sectionname" id="troopHeading"><b>ВОИТЕЛЬНИЦЫ</b><small>Нажимай, чтобы призвать</small></div>
  <div id="units" class="unitgrid"></div>
  <div class="sectionname" id="magicHeading"><b>МАГИЯ И КОМАНДИРША</b><small>Каждое умение 1 раз за бой</small></div>
  <div class="spells" id="spells"></div>
  <div id="battleShortcuts" class="battle-shortcuts"></div>
  <p class="hint" id="hint"></p>
</main>
<main id="otherPage" hidden></main>
<nav id="nav"></nav>
<div id="battleQuick" class="battle-quick" aria-label="Быстрые боевые команды" hidden></div>
</div>
<div id="modal" hidden></div>
<div id="toast"></div>
<input id="savefile" type="file" accept=".json,application/json,text/plain" hidden>
<script src="art.js?v=19" defer></script>
<script src="storybook.js?v=19" defer></script>
<script src="audio-v8.js?v=19" defer></script>
<script src="battle-v9.js?v=19" defer></script>
<script src="app.js?v=19" defer></script>
</body>
</html>
